services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lapanganku}
      POSTGRES_USER: ${POSTGRES_USER:-lapanganku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lapanganku}
    # Tuning ringan untuk VPS 4 GB. Naikkan bila RAM lebih besar.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lapanganku} -d ${POSTGRES_DB:-lapanganku}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Migration runner. Dijalankan otomatis sebelum backend start.
  # Backend menunggu service ini selesai sukses (service_completed_successfully).
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./backend/migrations:/migrations
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "${DATABASE_URL:-postgres://lapanganku:lapanganku@postgres:5432/lapanganku?sslmode=disable}"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://lapanganku:lapanganku@postgres:5432/lapanganku?sslmode=disable}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-lapanganku.id}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP}
      SAAS_ASK_TOKEN: ${SAAS_ASK_TOKEN}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # PUBLIC_* di-inline saat build (static env), jadi dikirim sebagai build arg.
      args:
        PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN:-lapanganku.id}
        PUBLIC_ROOT_URL: ${PUBLIC_ROOT_URL:-https://lapanganku.id}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      ORIGIN: ${PUBLIC_ROOT_URL:-https://lapanganku.id}
      PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN:-lapanganku.id}
      PUBLIC_ROOT_URL: ${PUBLIC_ROOT_URL:-https://lapanganku.id}
      # URL backend internal (nama service docker), dipakai server-side.
      API_URL: ${API_URL:-http://backend:8080}
      # Ditampilkan di halaman domain sebagai instruksi A record.
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP}
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:-lapanganku.id}
      # Wildcard subdomain platform, mis. "*.lapanganku.id".
      WILDCARD_DOMAIN: ${WILDCARD_DOMAIN:-*.lapanganku.id}
      ACME_EMAIL: ${ACME_EMAIL}
      SAAS_ASK_TOKEN: ${SAAS_ASK_TOKEN}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
